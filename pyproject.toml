[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funtable"
version = "1.0.47"
description = "A unified table storage abstraction library with support for multiple backends"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [ "table", "storage", "database", "kv", "key-value", "sqlite", "tinydb", "sqlmodel", "orm", "abstraction",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Database", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Archiving :: Backup", "Typing :: Typed",]
dependencies = [ "farlog>=1.1.7",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funtable"
Releases = "https://github.com/farfarfun/funtable/releases"

[project.optional-dependencies]
sqlmodel = [ "sqlmodel>=0.0.24",]
snapshot = [ "fundrive>=2.0.8",]
kv = [ "tinydb>=4.8.2",]
dev = [ "pytest>=9.0.3", "pytest-cov>=4.0.0", "ruff>=0.9.0", "mypy>=1.0.0",]
all = [ "funtable[sqlmodel,snapshot,kv]",]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
[[tool.mypy.overrides]]
module = [ "tinydb.*", "fundrive.*", "farlog.*",]
ignore_missing_imports = true

[tool.ruff.lint]
select = [ "E4", "E7", "E9", "F", "I",]

[tool.hatch.build.targets.wheel]
packages = ["src/funtable"]
